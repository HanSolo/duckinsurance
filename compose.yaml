services:
  duckinsurance:
    build: .
    ports:
      - "${DUCKINSURANCE_PORT:-8081}:8080"   # application, REST API (/api) and MCP endpoint (/api/mcp)
      - "4848:4848"   # Payara admin console (optional)
    # Model settings (Assistant and fraud agent) live in llm.env; edit it and run 'docker compose up -d' again. Needs Docker Compose 2.24 or newer for 'required: false'.
    env_file:
      - path: llm.env
        required: false
    extra_hosts:
      - "host.docker.internal:host-gateway"   # reach Ollama on the host (needed on Linux, harmless elsewhere)
    environment:
      # The fraud agent asks the DuckClinic (its MCP server) on the host. The clinic runs on host port 8080, DuckInsurance is published on 8081 (see .env).
      DUCKCLINIC_MCP_URL: http://host.docker.internal:8080/duck-clinic/api/mcp
      # Set to "off" to use only the rule-based fraud check
      DUCK_FRAUD_AGENT: "on"
      # Ask the user before a tool changes data: if-supported (default), always, off
      DUCK_CONFIRM_WRITES: if-supported
